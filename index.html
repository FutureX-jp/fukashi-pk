<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>フカシPK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=M+PLUS+1p:wght@500;800&display=swap">
<style>
  :root{
    color-scheme: dark;
    --night:#0c1620; --grass:#1d5a37; --line:#f3f6ef; --neon:#d8ff3c; --save:#ff4d5a; --ink:#0c1620;
    --ui: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --disp: "Anton", "Impact", "Arial Narrow", sans-serif;
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;background:var(--night);overflow:hidden;}
  body{font-family:var(--ui);color:var(--line);-webkit-user-select:none;user-select:none;}
  #stage{position:fixed;inset:0;touch-action:none;}
  #stage canvas{display:block;width:100%;height:100%;}
  #trail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
  .hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding-inline:16px;pointer-events:none;}
  .hud .score{font-family:var(--disp);font-size:28px;letter-spacing:.02em;line-height:1}
  .hud .score small{font-family:var(--ui);font-weight:800;font-size:11px;letter-spacing:.12em;display:block;opacity:.75;margin-bottom:2px}
  .kicks{display:flex;gap:6px;padding-top:6px}
  .kicks i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(243,246,239,.7);box-sizing:border-box}
  .kicks i.goal{background:var(--neon);border-color:var(--neon)}
  .kicks i.miss{background:var(--save);border-color:var(--save)}
  .kicks i.now{border-color:var(--neon);box-shadow:0 0 8px var(--neon)}
  .streak{justify-self:end;text-align:right;font-family:var(--disp);font-size:28px;line-height:1;color:var(--neon)}
  .streak small{font-family:var(--ui);font-weight:800;font-size:11px;letter-spacing:.12em;display:block;color:var(--line);opacity:.75;margin-bottom:2px}
  #banner{position:fixed;left:0;right:0;top:30%;text-align:center;font-family:var(--disp);font-size:clamp(96px,30vw,210px);-webkit-text-stroke:3px #0c1620;line-height:.9;letter-spacing:.01em;pointer-events:none;transform:scale(.6);opacity:0;transition:transform .18s cubic-bezier(.2,1.6,.4,1),opacity .12s}
  #banner.on{transform:scale(1);opacity:1}
  #banner.goal{color:var(--neon);text-shadow:0 4px 0 #0c1620,0 0 24px rgba(216,255,60,.55)}
  #banner.save{color:var(--save);text-shadow:0 4px 0 #0c1620}
  #banner.post,#banner.miss{color:var(--line);text-shadow:0 4px 0 #0c1620}
  #banner small{display:inline-block;font-family:var(--ui);font-weight:800;font-size:16px;letter-spacing:.1em;margin-top:12px;color:#fff;-webkit-text-stroke:0;text-shadow:none;background:rgba(12,22,32,.78);padding:6px 14px;border-radius:999px;line-height:1.3}
  #trick{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10%);padding-inline:12px;text-align:center;font-family:var(--ui);font-weight:800;font-size:clamp(40px,13vw,96px);line-height:1.04;letter-spacing:-.02em;pointer-events:none;opacity:0;transform:rotate(-6deg)}
  #trick.on{opacity:1}
  #gktrick{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14%);padding-inline:12px;text-align:center;font-family:var(--ui);font-weight:800;font-size:clamp(34px,11vw,82px);line-height:1.04;letter-spacing:-.02em;pointer-events:none;opacity:0;transform:rotate(5deg)}
  #gktrick.on{opacity:1}
  #gktrick .seg{display:inline-block;white-space:nowrap;visibility:hidden;background:linear-gradient(180deg,#ffffff 0%,#c8f6ff 30%,#39d0ff 52%,#2a5bff 72%,#5a12c8 100%);background-size:100% 220%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #06102a;filter:drop-shadow(0 6px 0 #06102a) drop-shadow(0 0 12px rgba(60,200,255,.95)) drop-shadow(0 0 28px rgba(90,60,255,.8));animation:fire .45s ease-in-out infinite alternate}
  #gktrick .seg.hit{visibility:visible;animation:dodon .24s cubic-bezier(.2,1.9,.35,1) both,fire .45s ease-in-out .24s infinite alternate}
  #gktrick.all{animation:allhitgk .7s cubic-bezier(.2,1.9,.35,1) both}
  #gktrick.all .seg{filter:drop-shadow(0 6px 0 #06102a) drop-shadow(0 0 18px rgba(220,250,255,1)) drop-shadow(0 0 44px rgba(60,200,255,.95)) drop-shadow(0 0 80px rgba(90,60,255,.8))}
  @keyframes allhitgk{0%{transform:rotate(5deg) scale(1)}22%{transform:rotate(2deg) scale(1.25)}55%{transform:rotate(7deg) scale(.96)}100%{transform:rotate(5deg) scale(1.06)}}
  #trick .seg{display:inline-block;white-space:nowrap;visibility:hidden;background:linear-gradient(180deg,#fffef0 0%,#ffe95a 28%,#ffb000 45%,#ff5a00 62%,#e3001b 80%,#7a0010 100%);background-size:100% 220%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #1a0500;filter:drop-shadow(0 6px 0 #1a0500) drop-shadow(0 0 10px rgba(255,120,0,.95)) drop-shadow(0 0 26px rgba(255,40,0,.75));animation:fire .5s ease-in-out infinite alternate}
  @keyframes fire{from{background-position:0 0}to{background-position:0 40%}}
  #trick .seg.hit{visibility:visible;animation:dodon .24s cubic-bezier(.2,1.9,.35,1) both,fire .5s ease-in-out .24s infinite alternate}
  @keyframes dodon{0%{transform:scale(3.4) translateY(-20px);opacity:0}55%{transform:scale(.88);opacity:1}100%{transform:scale(1)}}
  #trick.all{animation:allhit .7s cubic-bezier(.2,1.9,.35,1) both}
  #trick.all .seg{filter:drop-shadow(0 6px 0 #1a0500) drop-shadow(0 0 18px rgba(255,230,120,1)) drop-shadow(0 0 44px rgba(255,90,0,.95)) drop-shadow(0 0 80px rgba(255,0,0,.7))}
  @keyframes allhit{0%{transform:rotate(-6deg) scale(1)}22%{transform:rotate(-2deg) scale(1.25)}55%{transform:rotate(-8deg) scale(.96)}100%{transform:rotate(-6deg) scale(1.07)}}
  #shout{position:fixed;left:0;right:0;bottom:30%;text-align:center;font-family:var(--ui);font-weight:800;font-size:clamp(18px,5.5vw,28px);color:#fff;-webkit-text-stroke:1px #0c1620;text-shadow:0 4px 0 #0c1620,0 0 18px rgba(216,255,60,.8);pointer-events:none;opacity:0;padding-inline:16px}
  #shout.on{opacity:1;animation:shake .08s linear infinite}
  @keyframes shake{0%{transform:translate(2px,-1px) rotate(-2deg) scale(1.02)}50%{transform:translate(-2px,2px) rotate(2deg) scale(.98)}100%{transform:translate(1px,1px) rotate(-1deg) scale(1.03)}}
  #hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;font-weight:800;font-size:14px;letter-spacing:.12em;opacity:.9;pointer-events:none;transition:opacity .3s}
  #end{position:fixed;inset:0;display:grid;place-items:center;background:rgba(12,22,32,.72);backdrop-filter:blur(3px)}
  #end .box{text-align:center;padding-inline:16px;display:grid;gap:14px;justify-items:center}
  #end .big{font-family:var(--disp);font-size:clamp(72px,26vw,150px);line-height:.9;color:var(--neon)}
  #end .big span{color:var(--line);font-size:.45em}
  #end .sub{font-weight:800;letter-spacing:.14em;font-size:13px;opacity:.85}
  #end .best{font-size:13px;opacity:.75;font-variant-numeric:tabular-nums}
  #retry{font-family:var(--disp);font-size:34px;letter-spacing:.06em;color:var(--ink);background:var(--neon);border:0;border-radius:999px;padding:12px 44px;cursor:pointer;box-shadow:0 5px 0 #7f9a16}
  #retry:active{transform:translateY(3px);box-shadow:0 2px 0 #7f9a16}
  #retry:focus-visible{outline:3px solid var(--line);outline-offset:3px}
  #banner.on.goal{animation:punch .9s cubic-bezier(.2,1.8,.3,1) both}
  @keyframes punch{0%{transform:scale(2.6) rotate(-8deg);opacity:0}18%{transform:scale(.9) rotate(3deg);opacity:1}30%{transform:scale(1.08) rotate(-2deg)}45%{transform:scale(1) rotate(0)}100%{transform:scale(1.04) rotate(-1deg)}}
  #banner.on.save,#banner.on.post{animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes slam{0%{transform:translateX(-60%) skewX(-18deg);opacity:0}60%{transform:translateX(4%) skewX(6deg);opacity:1}100%{transform:none}}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff;mix-blend-mode:screen}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
  /* ===== 対戦モード ===== */
  #menu{position:fixed;inset:0;display:grid;place-items:center;background:rgba(12,22,32,.78);backdrop-filter:blur(3px);z-index:5}
  #menu .box{display:grid;gap:12px;justify-items:center;padding-inline:16px;width:min(392px,100vw);box-sizing:border-box;grid-template-columns:minmax(0,1fr)}
  #menu h1{margin:0 0 6px;font-family:var(--ui);font-weight:800;font-size:clamp(44px,15vw,72px);line-height:1;letter-spacing:-.02em;color:var(--neon);-webkit-text-stroke:2px #0c1620;text-shadow:0 5px 0 #0c1620,0 0 22px rgba(216,255,60,.5);transform:rotate(-4deg)}
  .mbtn{width:100%;font-family:var(--ui);font-weight:800;font-size:18px;color:var(--ink);background:var(--line);border:0;border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:0 5px 0 #8a948c;text-align:left}
  .mbtn.main{background:var(--neon);box-shadow:0 5px 0 #7f9a16}
  .mbtn small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:2px}
  .mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #7f9a16}
  .mbtn:focus-visible{outline:3px solid var(--neon);outline-offset:3px}
  #mhud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);display:grid;gap:4px;justify-items:center;pointer-events:none}
  #mhud .row{display:grid;grid-template-columns:4.5em auto 1.6em;align-items:center;gap:8px;font-weight:800;font-size:13px}
  #mhud .row b{text-align:right;opacity:.85}
  #mhud .row em{font-style:normal;font-family:var(--disp);font-size:22px;color:var(--neon);text-align:left}
  #mhud .row.on b{color:var(--neon);opacity:1}
  #mhud .kicks{padding:0}
  #turn{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
  #turn.on{opacity:1}
  #turn b{display:block;font-family:var(--disp);font-size:clamp(56px,18vw,120px);line-height:.95;color:var(--line);-webkit-text-stroke:2px #0c1620;text-shadow:0 4px 0 #0c1620}
  #turn b.keep{color:#39d0ff}
  #turn small{display:inline-block;margin-top:8px;font-weight:800;font-size:15px;letter-spacing:.06em;background:rgba(12,22,32,.7);padding:6px 12px;border-radius:999px}
  #end .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #toMenu{font-family:var(--ui);font-weight:800;font-size:15px;color:var(--line);background:transparent;border:2px solid rgba(243,246,239,.6);border-radius:999px;padding:10px 20px;cursor:pointer}
  #clipBtn{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:4;font-family:var(--ui);font-weight:800;font-size:14px;color:var(--ink);background:var(--neon);border:0;border-radius:999px;padding:10px 16px;box-shadow:0 4px 0 #7f9a16;cursor:pointer}
  #clipBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #7f9a16}
  #clipBtn[disabled]{opacity:.6}
  #clipMsg{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);z-index:4;font-weight:800;font-size:12px;background:rgba(12,22,32,.8);padding:6px 10px;border-radius:8px;max-width:70vw}
  #fps{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);font:600 11px/1 ui-monospace,monospace;opacity:.55;pointer-events:none;font-variant-numeric:tabular-nums}
  #godBtn{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);z-index:4;font-family:var(--ui);font-weight:800;font-size:15px;color:#3a2500;background:linear-gradient(180deg,#fff3c4,#ffc83d);border:0;border-radius:999px;padding:11px 16px;box-shadow:0 4px 0 #a06d00,0 0 18px rgba(255,200,60,.7);cursor:pointer;animation:godpulse 1s ease-in-out infinite alternate}
  @keyframes godpulse{to{box-shadow:0 4px 0 #a06d00,0 0 30px rgba(255,220,90,1)}}
  #lobby{position:fixed;inset:0;display:grid;place-items:center;background:rgba(12,22,32,.86);backdrop-filter:blur(3px);z-index:6}
  #lobby .box{display:grid;gap:12px;justify-items:center;padding-inline:16px;width:min(392px,100vw);box-sizing:border-box;grid-template-columns:minmax(0,1fr);text-align:center}
  #lobby h2{margin:0;font-weight:800;font-size:26px;color:var(--neon)}
  #lbMsg{margin:0;font-weight:800;font-size:14px;line-height:1.6;min-height:3em}
  #lbCodeBig{font-family:var(--disp);font-size:72px;letter-spacing:.12em;color:var(--line);line-height:1}
  #lobby .jr{display:flex;gap:8px;width:100%}
  #lbCode{flex:1;min-width:0;font-family:var(--disp);font-size:28px;letter-spacing:.2em;text-align:center;border-radius:14px;border:2px solid rgba(243,246,239,.5);background:rgba(255,255,255,.08);color:var(--line);padding:8px}
  #lobby .jr .mbtn{width:auto;text-align:center}
  #lbBack{font-family:var(--ui);font-weight:800;font-size:14px;color:var(--line);background:transparent;border:0;text-decoration:underline;cursor:pointer;padding:8px}
  @media (prefers-reduced-motion: reduce){#banner,#banner.on.goal,#banner.on.save,#banner.on.post{transition:none;animation:none}}
</style>

<div id="stage"></div>
<canvas id="trail"></canvas>
<div class="hud">
  <div class="score"><small>GOAL</small><span id="sc">0</span><span style="font-size:.6em;opacity:.7">/5</span></div>
  <div class="kicks" id="kicks"></div>
  <div class="streak"><small>連続</small>×<span id="st">0</span></div>
</div>
<div id="vig"></div>
<div id="flash"></div>
<div id="banner"></div>
<div id="trick"></div>
<div id="gktrick"></div>
<div id="shout"></div>
<div id="hint">↑ 上へフリックでシュート<br><small style="font-weight:500;letter-spacing:.04em;opacity:.8">技：輪を描く＝宙返り ／ 輪2回＝側転 ／ ジグザグ＝トルネード<br>一度下げてから上＝オーバーヘッド ／ 押して一瞬止めてから＝ドロップキック</small></div>
<div id="end" hidden>
  <div class="box">
    <div class="sub">5本勝負の結果</div>
    <div class="big"><b id="endScore">3</b><span> / 5</span></div>
    <div class="best" id="best"></div>
    <div class="row2"><button id="retry" type="button">RETRY</button><button id="toMenu" type="button">モードを選ぶ</button></div>
  </div>
</div>
<div id="mhud" hidden>
  <div class="row" id="rowA"><b id="nA">あなた</b><span class="kicks" id="kA"></span><em id="sA">0</em></div>
  <div class="row" id="rowB"><b id="nB">CPU</b><span class="kicks" id="kB"></span><em id="sB">0</em></div>
</div>
<button id="godBtn" type="button" hidden>神セーブ（1回だけ）</button>
<button id="clipBtn" type="button" hidden>▶ 今のシュートを共有</button>
<div id="clipMsg" hidden></div>
<div id="fps"></div>
<div id="turn"><b id="turnT">YOUR KICK</b><small id="turnS"></small></div>
<div id="lobby" hidden>
  <div class="box">
    <h2>友だちと対戦</h2>
    <div id="lbCodeBig" hidden></div>
    <p id="lbMsg">部屋を作って番号を相手に伝える／相手の番号を入れて入る</p>

    <button id="lbBack" type="button">もどる</button>
  </div>
</div>
<div id="menu">
  <div class="box">
    <h1>フカシPK</h1>
    <button class="mbtn main" data-mode="cpu" type="button">PK戦 vs CPU<small>蹴って・守って交互に5本ずつ。同点ならサドンデス</small></button>
    <button class="mbtn" id="onlineBtn" type="button">友だちと対戦（通信）<small>それぞれ自分のスマホで。部屋番号4桁で入る</small></button>
    <button class="mbtn" data-mode="solo" type="button">5本チャレンジ<small>ひとりで蹴るだけ（いままでのモード）</small></button>
    <button id="ttsBtn" class="mbtn" type="button" style="text-align:center;background:transparent;color:var(--line);border:2px solid rgba(243,246,239,.5);box-shadow:none">読み上げ：ON</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<script>
(()=>{
// ===== 実寸（m, s, kg） =====
const GOAL_W=7.32, GOAL_H=2.44, POST_R=0.06, BALL_R=0.11, SPOT_Z=11.0, NET_D=2.0;
const G=9.81, DRAG=0.0065;            // 空気抵抗 ½ρCdA/m ≒ 0.5*1.2*0.25*0.038/0.43 ×0.5（体感で弱め）
const KICKS=5;
const HALF=GOAL_W/2;

// ===== three.js =====
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0c1620);
scene.fog=new THREE.Fog(0x0c1620,30,70);
const camera=new THREE.PerspectiveCamera(55,1,0.05,200);
const CAM=new THREE.Vector3(0.9,2.3,16.4), LOOK=new THREE.Vector3(-0.2,0.95,2.5);   // キッカーの宙返り(高さ2.5m)まで入る引き

const hemi=new THREE.HemisphereLight(0xdfe8ff,0x1d5a37,0.65); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.position.set(-8,18,20); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:60});
scene.add(sun);
const rim=new THREE.DirectionalLight(0xbfd8ff,0.55); rim.position.set(10,8,-14); scene.add(rim);   // 逆光で体の輪郭を立てる
// 照明塔（光る板＋にじみ）
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,240,1)');r.addColorStop(.25,'rgba(255,250,220,.55)');r.addColorStop(1,'rgba(255,250,220,0)');g.fillStyle=r;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();
const towers=[];
for(const [x,z] of [[-24,-8],[24,-8]]){ const panel=new THREE.Mesh(new THREE.BoxGeometry(5,2.2,0.3),new THREE.MeshBasicMaterial({color:0xfffbe6})); panel.position.set(x,19,z); panel.lookAt(0,0,6); scene.add(panel);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true})); halo.scale.set(16,10,1); halo.position.copy(panel.position); scene.add(halo); towers.push(halo);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.5,19,8),new THREE.MeshLambertMaterial({color:0x2a3440})); pole.position.set(x,9.5,z-0.6); scene.add(pole); }

// ピッチ（縞＋ライン：実寸で描く 20px/m）
(function pitch(){
  const PX=20, W=60, D=44, c=document.createElement('canvas'); c.width=W*PX; c.height=D*PX;
  const g=c.getContext('2d');

function burst({at,n=120,colors=['#d8ff3c'],speed=6,spread=1,up=0,grav=9.8,life=1.2,size=0.08,add=false,drag=0.6}){
  const geo=new THREE.BufferGeometry(), P=new Float32Array(n*3), C=new Float32Array(n*3), V=[];
  const col=new THREE.Color();
  for(let i=0;i<n;i++){ P[i*3]=at.x;P[i*3+1]=at.y;P[i*3+2]=at.z; col.set(colors[(Math.random()*colors.length)|0]); C[i*3]=col.r;C[i*3+1]=col.g;C[i*3+2]=col.b;
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), sp=speed*(0.35+Math.random()*0.65);
    V.push(new THREE.Vector3(Math.sin(ph)*Math.cos(th)*sp*spread, Math.cos(ph)*sp+up, Math.sin(ph)*Math.sin(th)*sp*spread)); }
  geo.setAttribute('position',new THREE.BufferAttribute(P,3)); geo.setAttribute('color',new THREE.BufferAttribute(C,3));
  const m=new THREE.Points(geo,new THREE.PointsMaterial({size:add?size*2.2:size,map:add?glowTex:null,vertexColors:true,transparent:true,depthWrite:false,blending:add?THREE.AdditiveBlending:THREE.NormalBlending}));
  scene.add(m); FX.push({m,V,grav,life,t:0,drag});
}
function ring(at,color=0xd8ff3c,maxS=7,life=0.4){ const m=new THREE.Mesh(new THREE.RingGeometry(0.12,0.19,40),new THREE.MeshBasicMaterial({color,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.position.copy(at); m.lookAt(camera.position); scene.add(m); FX.push({m,ring:true,maxS,life,t:0}); }
function updFX(dt){ for(let i=FX.length-1;i>=0;i--){ const f=FX[i]; f.t+=dt; const k=f.t/f.life;
    if(f.ring){ const sc=1+f.maxS*(1-Math.pow(1-Math.min(1,k),3)); f.m.scale.set(sc,sc,sc); f.m.material.opacity=Math.max(0,1-k); }
    else { const P=f.m.geometry.attributes.position.array; for(let j=0;j<f.V.length;j++){ const v=f.V[j]; v.y-=f.grav*dt; v.multiplyScalar(1-f.drag*dt); P[j*3]+=v.x*dt;P[j*3+1]+=v.y*dt;P[j*3+2]+=v.z*dt; if(P[j*3+1]<0.02){P[j*3+1]=0.02; v.y*=-0.3; v.x*=0.7; v.z*=0.7;} }
      f.m.geometry.attributes.position.needsUpdate=true; f.m.material.opacity=Math.max(0,1-k*k); }
    if(k>=1){ scene.remove(f.m); f.m.geometry.dispose(); FX.splice(i,1); } } }

function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)(); OUT=AC.createGain(); OUT.connect(AC.destination); if(AC.createMediaStreamDestination){ recDest=AC.createMediaStreamDestination(); OUT.connect(recDest); } }catch(e){ console.error('audio init '+e.name+': '+e.message); } } }
function tone(f,d,type='sine',v=.4,slide=0){ if(!AC)return; const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.value=f; if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d); g.gain.setValueAtTime(v,AC.currentTime); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d); o.connect(g).connect(OUT); o.start(); o.stop(AC.currentTime+d); }
function crowd(d=1.4,v=.35){ if(!AC)return; const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0); for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.min(1,i/(n*.1))*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=.6; const g=AC.createGain(); g.gain.value=v; s.connect(f).connect(g).connect(OUT); s.start(); }

function tryShot(){
  const a=pts[0], b=pts[pts.length-1], H=innerHeight;
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
  if(len<H*0.05 || dy>-H*0.015) return;                          // 短すぎ・下向きは無効
  // 指を離した位置を画面→ゴール面(z=0)に投影＝狙い
  const ax2=a.x+dx*0.8, ay2=a.y+dy*0.8;   // 指の勢いで行き過ぎる分を2割戻して狙いにする
  const ndc=new THREE.Vector3((ax2/innerWidth)*2-1,-(ay2/H)*2+1,0.5).unproject(camera);
  const dir=ndc.sub(camera.position).normalize();
  let tx, ty;
  if(dir.z<-1e-3){ const k=-camera.position.z/dir.z; tx=camera.position.x+dir.x*k; ty=camera.position.y+dir.y*k; }
  else { tx=0; ty=3; }
  ty=Math.max(BALL_R,ty);
  // 曲がり：軌跡の弦からの最大ずれ（符号つき・弦長で正規化）
  let dev=0; for(const p of pts){ const c=((p.x-a.x)*dy-(p.y-a.y)*dx)/len; if(Math.abs(c)>Math.abs(dev))dev=c; }
  const curve=THREE.MathUtils.clamp(dev/len*3.2,-1,1);           // +:右にふくらむ
  // 速さ：画面の高さ/秒 → 12〜32 m/s（実際のPKは20〜30m/s台）
  // 速さは「最後の4割」の指の速さで測る（輪やジグザグ、止めた時間で遅く判定しない）
  let cum=0, tot=0; for(let i=1;i<pts.length;i++) tot+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  let i0=0; for(let i=1;i<pts.length;i++){ cum+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y); if(cum>=tot*0.6){ i0=i; break; } }
  const p0=pts[i0], T=Math.max(0.03,(b.t-p0.t)/1000), vs=(Math.hypot(b.x-p0.x,b.y-p0.y)/H)/T;
  const speed=THREE.MathUtils.clamp(11+vs*5.2+(len/H)*4,12,32);
  // 技は「わざと描いた形」のときだけ出す（普通のスワイプでは出さない）
  let turn=0, prevA=null, rev=0, hdir=0, acc=0, minY=0;
  for(let i=2;i<pts.length;i++){ const ax=pts[i].x-pts[i-2].x, ay=pts[i].y-pts[i-2].y; if(Math.hypot(ax,ay)<6)continue; const ang=Math.atan2(ay,ax);
    if(prevA!==null){ let d=ang-prevA; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; turn+=d; } prevA=ang; }
  for(let i=1;i<pts.length;i++){ const mx=pts[i].x-pts[i-1].x, sg=Math.sign(mx); if(!sg)continue;             // 横の折り返し（20px以上動いてから逆向き）
    if(sg===hdir){ acc+=Math.abs(mx); } else { if(hdir&&acc>12)rev++; hdir=sg; acc=Math.abs(mx); } }
  for(const q of pts) minY=Math.max(minY,q.y-a.y);                                                              // 一度どれだけ下げたか
  const still=(()=>{ for(const q of pts){ if(Math.hypot(q.x-a.x,q.y-a.y)>16) return (q.t-a.t)/1000; } return 0; })();
  let trick=null;
  if(Math.abs(turn)>8.2) trick='cartwheel';
  else if(Math.abs(turn)>4.0) trick='flip';
  else if(rev>=2) trick='tornado';
  else if(minY>H*0.045) trick='bicycle';
  else if(still>0.3) trick='drop';
  beginRun({tx,ty,curve,speed,vs},trick,len/H);
}
function beginRun(shot,trick,lenH){

  S.shot=shot; R.tier=tierOf(shot.vs); R.trick=trick; R.trickName=shot.name||null; hideTurn(); recStart(); S.kt=0;
  S.runDur=THREE.MathUtils.clamp(0.95-lenH*0.5,0.5,0.95); S.charged=false; S.chargeAt=R.trick?0.62:0.86; S.chargeDur=0.95+0.25*R.tier; R.chargeStyle=shot.cs;
  S.runT=0; if(R.tier===0)S.runDur+=0.35; if(R.trick)S.runDur+=0.6; S.phase='run';
  if(M.mode==='online'&&humanKicks()) NET2.send({shot:{n:M.turn,...shot,trick}});   // 相手の画面でも同じキックを再生
}

function jaVoice(male){ if(!window.speechSynthesis) return null; const v=speechSynthesis.getVoices().filter(x=>/^ja/i.test(x.lang)); if(!v.length) return null;
  const hi=x=>/premium|enhanced|拡張|高品質/i.test(x.name);
  if(male){ const m=v.filter(x=>/otoya|hattori|ichiro|keita|daichi|male|男/i.test(x.name)); if(m.length) return m.find(hi)||m[0]; }
  return v.find(hi)||v.find(x=>/kyoko|o-ren|google/i.test(x.name))||v[0]; }
// 語尾を伸ばす：「ボンバ」→「ボンバァァァ」
const VOW={ア:'アカサタナハマヤラワガザダバパャァ',イ:'イキシチニヒミリギジヂビピィ',ウ:'ウクスツヌフムユルグズヅブプュゥッ',エ:'エケセテネヘメレゲゼデベペェ',オ:'オコソトノホモヨロヲゴゾドボポョォ'};
function stretch(w,n=3){ const m=w.match(/([ァ-ヶー])[^ァ-ヶー]*$/); if(!m) return w+'ーー'; const ch=m[1]; let v='ー'; for(const k in VOW){ if(VOW[k].includes(ch)){ v={ア:'ァ',イ:'ィ',ウ:'ゥ',エ:'ェ',オ:'ォ'}[k]; break; } } return w.replace(/([ァ-ヶー])([^ァ-ヶー]*)$/,(_,c,t)=>c+v.repeat(n)+t); }
function utter(text,rate,pitch,male,vol=1){ const u=new SpeechSynthesisUtterance(text.replace(/Ⅱ/g,'ツー').replace(/[（）()・…]/g,' ')); u.lang='ja-JP'; const v=jaVoice(male); if(v) u.voice=v; u.rate=rate; u.pitch=Math.min(2,Math.max(0,pitch)); u.volume=vol; speechSynthesis.speak(u); }
// 技名の実況：「出たぁぁ！」→ 区切りごとに一段ずつ声を上げる → 最後の区切りはゆっくり伸ばして叫ぶ
function sayHype(name,gk){

    if(h){ const vn=vel.x*h.nx+vel.y*h.ny; vel.x=vel.x-2*vn*h.nx*0.5+h.nx*3; vel.y=Math.abs(vel.y)*0.4+h.ny*2; vel.z=Math.abs(vel.z)*0.35; sideAcc=0; hitStop(0.14); flash('#ff4d5a',0.4,300); S.shake=0.4; burst({at:pos.clone(),n:110,colors:['#ffffff','#d8ff3c'],speed:6,grav:5,life:0.8,size:0.07,add:true}); ring(pos.clone(),0xff4d5a,6,0.35); if(h.u>0.72){ R.face=true; jolt(keeper,'head',-24); jolt(keeper,'sx',6); jolt(keeper,'sy',-6); tone(300,0.1,'square',.12,120);} else R.face=false; tryResolve('save'); }
    else if(pos.z<-BALL_R && Math.abs(pos.x)<HALF && pos.y<GOAL_H) tryResolve('goal');
    else if(pos.z<-0.5 || (S.t>0.6 && vel.z>-0.5 && pos.z>0) || S.t>3.2) tryResolve(postHit?'post':'miss');
  }
  // ネット：裏と横で止める
  if(S.resolved==='goal'){ if(pos.z<-NET_D+0.2){pos.z=-NET_D+0.2; vel.z*=-0.15; vel.x*=0.4;} if(Math.abs(pos.x)>HALF-0.15){pos.x=Math.sign(pos.x)*(HALF-0.15); vel.x*=-0.2;} if(pos.y>GOAL_H-0.15&&pos.z<0){pos.y=GOAL_H-0.15; vel.y*=-0.2;} }
}

function tryResolve(r){
  if(M.mode==='online'&&remoteKeeps()){ S.localR=r; S.localRAt=performance.now(); return; }   // 判定は相手（キーパー側）から届く
  resolve(r); if(M.mode==='online') NET2.send({res:{n:M.turn,r,face:!!R.face}});
}
function resolve(r){
  S.resolved=r; const ok=r==='goal'; S.results[S.kick]=ok; if(M.mode!=='solo') M[kickSide()].push(ok);
  if(humanKeeps()&&r==='save'&&!R.god){ setTimeout(()=>showTrick(genGKName(),true),350); }   // 人間キーパーが止めたら守りの技名
  hitStop(ok?0.28:0.16); if(ok){S.goals++;S.streak++; S.shake=0.9; crowd(2.4,.6); tone(520,0.12,'square',.08); flash('#ffffff',0.9,380); fireworks(); confetti(); Object.assign(NET,{t:0,x:pos.x,y:pos.y,amp:0.35+vel.length()*0.02}); S.strobe=1.6; }
  else { S.streak=0; if(r==='save'){tone(140,0.25,'sine',.5); crowd(0.9,.18);} }
  const txt={goal:['GOAL!!', postHit?'ポストに当てて入った':(Math.abs(pos.x)>2.6&&pos.y>1.6?'上隅を撃ち抜いた':'')],save:['SAVE!','キーパーに止められた'],post:['POST!','枠に嫌われた'],miss:['MISS',pos.y>GOAL_H?'バーの上':'枠の外']}[r];
  if(r==='save'&&R.face) txt[1]='顔面ブロック'; if(r==='save'&&R.gkSp) txt[1]=R.god?'神セーブ発動':'必殺セーブ（'+GKSP[R.gkSp]+'）'; if(ok&&R.gkSp) txt[1]='必殺技を打ち破った';
  if(R.kick==='land'){ R.cheer=ok; } else if(R.kick!=='recoil'){ R.kick= ok?(Math.random()<0.5?'dance':'jumpfall'):'slump'; R.kickT=0; }
  trailOn=ok||trailOn; R.gk= ok?'sad':(r==='save'&&R.face?'face':'celebrate'); R.gkT=0;
  if(isKeeperSide()){ txt[0]={goal:'GOAL…',save:'SAVE!!',post:'POST!',miss:'MISS'}[r]; if(r==='save')txt[1]=R.god?'神セーブ発動':R.face?'顔面ブロック':'ナイスセーブ'; }   // 守る番は立場が逆
  { const gkTurn=isKeeperSide(); say((gkTurn?{goal:'決められたぁぁ…',save:'止めたぁぁぁ！ナイスセーブ！',post:'助かったぁぁ！',miss:'外したぁぁ！'}:{goal:'ゴォォォォォォル！！',save:'止められたぁぁ！',post:'ポストォォォ！',miss:'外れたぁぁ！'})[r],{cut:false,rate:gkTurn?1.1:0.85,pitch:r==='goal'&&!gkTurn?1.7:1.3}); }
  showBanner(txt[0],txt[1],isKeeperSide()?(ok?'miss':'goal'):r); S.bannerT=2.4; drawHud();
}
const banner=document.getElementById('banner');

// ===== 動き（馬鹿っぽさはここ） =====
function animate(dt,now){
  const K=kicker.sp, P=keeper.sp;
  kicker.legs[1].scale.y+=(1-kicker.legs[1].scale.y)*Math.min(1,dt*6);
  if(S.phase==='aim'||S.phase==='cpuwait'||S.phase==='oppwait'||S.phase==='menu'){                                   // 待機：ゆらゆら
    kicker.root.position.copy(KICK_FROM); K.lean.t=0.05+Math.sin(now*3)*0.05; K.armL.t=K.armR.t=0; K.armLz.t=K.armRz.t=0.25+Math.sin(now*4)*0.06; K.legL.t=K.legR.t=0; K.head.t=Math.sin(now*2)*0.1; K.leanZ.t=0;
  } else if(S.phase==='run'){
    const k=Math.min(1,S.runT/S.runDur), tier=R.tier; let e;
    if(tier===0){ const stop=k>0.6&&k<0.86; e=k<0.6?k/0.6*0.8:(stop?0.8:0.8+(k-0.86)/0.14*0.2); kicker.mouth.visible=stop; K.headZ.t=stop?0.4:0; }   // トコトコ→「えっ？」
    else if(tier===1){ e=k<0.6?k/0.6*0.35:0.35+0.65*Math.pow((k-0.6)/0.4,0.7); }                                  // 最後の2歩だけ全力
    else e=k<0.5?0.18*(k/0.5):0.18+0.82*Math.pow((k-0.5)/0.5,0.6);                   // じわじわ→急にダッシュ
    kicker.root.position.lerpVectors(KICK_FROM,KICK_TO,Math.min(1,e));
    const stop=tier===0&&k>0.6&&k<0.86, freq=[4,6,8,10][tier], amp=stop?0:[0.5,0.9,1.3,1.6][tier], sw=Math.sin(k*Math.PI*freq)*amp;
    K.legL.t=sw; K.legR.t=-sw; K.armL.t=-sw*1.3; K.armR.t=sw*1.3; K.armLz.t=K.armRz.t=0.4+Math.abs(sw)*0.6;
    K.lean.t=[0.05,0.2,0.65,0.8][tier]; K.leanZ.t=-(S.shot?S.shot.curve:0)*0.7;             // カーブは体ごと傾く
    kicker.root.position.y=Math.abs(Math.sin(k*Math.PI*freq))*0.05*(tier+1);
    if(tier===3&&k>0.7&&k<0.95) kicker.root.rotation.y=R.baseRot+(k-0.7)/0.25*Math.PI*2;   // 勢い余って1回転
    else if(!(R.trick&&k>0.62)) kicker.root.rotation.y=R.baseRot;
    if(k>0.9) K.legR.t=1.0;                                                                 // 振りかぶり
    if(R.trick){ const kr=Math.min(1,k/0.62); kicker.root.position.lerpVectors(KICK_FROM,KICK_TO,kr*kr*(3-2*kr));
      if(k>0.62){ const u=(k-0.62)/0.38, P2=Math.PI*2; kicker.root.position.copy(KICK_TO);
        if(R.trick==='flip'){ kicker.root.position.y=Math.sin(u*Math.PI)*1.2; kicker.squash.rotation.x=u*P2; K.legL.t=K.legR.t=u<0.8?-1.6:0; if(u>0.8)K.legR.t=-2.2; K.armLz.t=K.armRz.t=0.3; K.lean.t=0.4; }
        else if(R.trick==='tornado'){ kicker.root.position.y=Math.sin(u*Math.PI)*0.9; kicker.root.rotation.y=R.baseRot+u*P2*3; K.legR.t=-1.5; K.legL.t=0.3; K.armLz.t=K.armRz.t=1.6; K.leanZ.t=0.5; }
        else if(R.trick==='bicycle'){ kicker.root.position.y=Math.sin(u*Math.PI)*1.35; kicker.squash.rotation.x=-u*Math.PI*1.15; K.legL.t=-2.6*u; K.legR.t=-2.2*u+Math.sin(u*30)*0.6; K.armL.t=Math.sin(u*25)*1.5; K.armR.t=-Math.sin(u*25)*1.5; K.armLz.t=K.armRz.t=1.4; }
        else if(R.trick==='cartwheel'){ kicker.root.position.x=KICK_TO.x-Math.sign(S.shot.curve||1)*(1-u)*0.9; kicker.root.position.y=Math.abs(Math.sin(u*Math.PI))*0.35; kicker.squash.rotation.z=u*P2*Math.sign(S.shot.curve||1); K.armLz.t=K.armRz.t=2.9; K.legL.t=0.9; K.legR.t=-0.9; }
        else if(R.trick==='drop'){ kicker.root.position.y=Math.sin(u*Math.PI)*0.75+0.2*u; kicker.squash.rotation.x=-1.35*Math.min(1,u*1.8); K.legL.t=K.legR.t=-1.5; K.armLz.t=K.armRz.t=2.6; kicker.mouth.visible=true; }
      } }
  }
  if(R.kick){ R.kickT+=dt; const t=R.kickT;
    if(R.kick==='land'){ const y=Math.max(0,R.y0-0.5*G*t*t); kicker.root.position.y=y; const down=y<=0;
      if(down&&!R.landed){ R.landed=true; jolt(kicker,'sy',-5); jolt(kicker,'sx',3); tone(120,0.12,'sine',.3); }
      const tr=R.trick, m=Math.min(1,t*4);
      if(tr==='flip'){ kicker.squash.rotation.x=0; K.legL.t=K.legR.t=0.3; K.lean.t=down?0.7:0.2; if(down&&t<0.9)kicker.root.position.z=KICK_TO.z-Math.min(0.6,(t-0.2)*1.5); }       // 着地でつんのめる
      else if(tr==='tornado'){ kicker.root.rotation.y+=dt*Math.max(0,10-t*12); kicker.squash.rotation.z=Math.sin(t*9)*0.25*Math.min(1,t*2); K.headZ.t=Math.sin(t*11)*0.5; kicker.mouth.visible=true; }  // 目が回ってフラフラ
      else if(tr==='cartwheel'){ kicker.squash.rotation.z=0; K.armLz.t=K.armRz.t=2.9; }      // 着地でポーズ
      else { kicker.squash.rotation.x=R.rx0+(-1.5-R.rx0)*m; kicker.root.position.y=Math.max(-0.82,y-0.82*m); K.legL.t=K.legR.t=-1.3; }          // オーバーヘッド・ドロップは背中から落ちる
      if(R.cheer===true&&t>0.5){ if(tr==='bicycle'||tr==='drop'){ K.legL.t=-1.3+Math.sin(t*16)*0.8; K.legR.t=-1.3-Math.sin(t*16)*0.8; K.armLz.t=K.armRz.t=2.8; } else { K.armLz.t=K.armRz.t=2.8; K.armL.t=Math.sin(t*14); K.leanZ.t=Math.sin(t*9)*0.4; kicker.root.rotation.y+=dt*3; } kicker.mouth.visible=true; }
      if(R.cheer===false&&t>0.5){ K.legL.t=-0.4+Math.sin(t*27)*0.35; K.legR.t=-0.4-Math.sin(t*22)*0.35; K.armLz.t=K.armRz.t=0.2; K.head.t=0.4; }
    }
    if(R.kick==='follow'){ K.legR.t=-1.7; K.armL.t=0.9; K.armR.t=-0.7; K.lean.t=-0.1; kicker.root.position.y=R.jump?Math.max(0,3*t-4.9*t*t):0; }
    else if(R.kick==='recoil'){ const k=Math.min(1,t/0.45); kicker.root.position.z=R.rz+k*0.7; kicker.root.position.x=KICK_TO.x-k*1.3; kicker.root.position.y=Math.max(0,Math.sin(k*Math.PI)*0.55); kicker.squash.rotation.x=-1.3*k; kicker.root.position.y-=0.55*k; K.legL.t=K.legR.t=-1.3; K.armL.t=K.armR.t=-2.4; kicker.mouth.visible=true;
      if(t>0.45&&t<0.5) jolt(kicker,'sy',-4); if(t>0.6){ K.legL.t=-1.3+Math.sin(t*25)*0.3; K.legR.t=-1.3-Math.sin(t*21)*0.3; } }
    else if(R.kick==='dance'){ K.armLz.t=K.armRz.t=2.5; K.armL.t=Math.sin(t*14)*1.3; K.armR.t=-Math.sin(t*14)*1.3; K.leanZ.t=Math.sin(t*10)*0.5; K.legL.t=Math.max(0,Math.sin(t*10))*0.9; K.legR.t=Math.max(0,-Math.sin(t*10))*0.9; kicker.root.rotation.y+=dt*4; kicker.root.position.y=Math.abs(Math.sin(t*10))*0.14; kicker.mouth.visible=true; K.head.t=Math.sin(t*20)*0.3; }
    else if(R.kick==='jumpfall'){ kicker.root.position.y=Math.max(0,4.2*t-4.9*t*t); K.armLz.t=K.armRz.t=2.9; K.legL.t=0.8; K.legR.t=-0.8; if(t>0.86){ kicker.squash.rotation.z=Math.min(1.5,(t-0.86)*7); kicker.root.position.y-=0.8*Math.min(1,(t-0.86)*7); kicker.mouth.visible=true; if(t<0.9) jolt(kicker,'sy',-3);} }   // 着地失敗
    else if(R.kick==='slump'){ const k=Math.min(1,t/0.5); kicker.squash.rotation.x=1.45*k*k; kicker.root.position.y=-0.8*k*k; K.armL.t=-2.7; K.armLz.t=K.armRz.t=0.35; K.head.t=0.3; if(t>0.6){ K.legL.t=-0.2+Math.sin(t*28)*0.35; K.legR.t=-0.2-Math.sin(t*23)*0.35; } }   // 崩れ落ちて足ピクピク
  }
  springs(kicker,dt);
  // キーパー
  if(!GK.active){ keeperPivot.position.x=Math.sin(now*1.7)*0.35; GK.cx=keeperPivot.position.x; P.armLz.t=P.armRz.t=2.1+Math.sin(now*8)*0.3; P.armL.t=P.armR.t=0; P.legL.t=P.legR.t=0; P.lean.t=0.25; P.head.t=0; keeper.root.position.y=-0.95+Math.abs(Math.sin(now*5))*0.04; }
  else if(!R.gk){ P.armLz.t=P.armRz.t=2.95; P.legL.t=0.6; P.legR.t=-0.5; P.lean.t=0; keeper.mouth.visible=R.wrong&&GK.t0>GK.react+0.15; }   // 逆に飛んだら空中で「O」
  if(R.gk){ R.gkT+=dt; const t=R.gkT;
    if(R.gk==='face'){ keeper.mouth.visible=true; P.armLz.t=P.armRz.t=1.0; P.legL.t=0.9; P.legR.t=-0.9; }
    else if(R.gk==='celebrate'){ P.armLz.t=P.armRz.t=2.9+Math.sin(t*18)*0.35; P.armL.t=Math.sin(t*18)*0.5; keeper.mouth.visible=true; if(t>0.5&&GK.to.cy<1.0){ GK.to.th*=0.92; GK.to.cy+=(0.95-GK.to.cy)*0.08; } }
    else if(R.gk==='sad'){ if(t>1.0){ GK.to.cy=Math.max(0.45,GK.to.cy-dt*0.9); P.head.t=0.8; P.armLz.t=P.armRz.t=0.1; P.lean.t=0.7; keeper.squash.rotation.x=Math.min(1.2,(t-1.0)*2); keeper.root.position.y=-0.95-0.5*Math.min(1,(t-1.0)*2); } }   // 1秒固まってから崩れる
  }
  keeperPivot.position.set(GK.cx,GK.cy,0.1); keeperPivot.rotation.set(0,0,0); keeperPivot.rotateZ(-GK.th); updGKSp(dt);
  springs(keeper,dt,140,9);
}

      const u=k, hx=bx+Math.sin(u*Math.PI)*W*0.12+u*W*0.14, hy=by-u*H*0.42; tg.fillStyle='#f3f6ef'; tg.beginPath(); tg.arc(hx,hy,16,0,7); tg.fill(); tg.fillStyle='#0c1620'; tg.beginPath(); tg.arc(hx,hy,6,0,7); tg.fill(); }

// ネットのたわみ（当たった点から波が広がって減衰）
function updNet(dt){ if(!netLines||NET.t>3)return; NET.t+=dt; const P=netLines.geometry.attributes.position.array, t=NET.t;
  for(let i=0;i<P.length;i+=3){ const bx=netBase[i],by=netBase[i+1],bz=netBase[i+2]; if(bz>-0.05){P[i+2]=bz;continue;}
    const d2=(bx-NET.x)**2+(by-NET.y)**2, w=NET.amp*Math.exp(-d2/1.2)*Math.exp(-t*2.4)*Math.cos(t*16-Math.sqrt(d2)*3); P[i+2]=bz-w*1.6; P[i+1]=by-w*0.3; }
  netLines.geometry.attributes.position.needsUpdate=true; }
// ゴール時の照明の明滅
function updStrobe(dt,now){ if(S.strobe>0){ S.strobe-=dt; const on=Math.sin(now*40)>0; sun.intensity=on?1.6:0.6; hemi.intensity=on?1.1:0.5; towers.forEach(t=>t.material.opacity=on?1:0.4); } else { sun.intensity=0.9; hemi.intensity=0.65; towers.forEach(t=>t.material.opacity=1);} }
let camSmooth=null;
// ===== 通信対戦（room の presence だけで同期する。topic は使わない＝閲覧だけの人も送れる） =====
// 自分の presence.pk に {code, role, go, shot/dive/god/res(各 n=ターン番号)} を置き、相手の pk を毎フレーム読む
const NET2={room:null,ready:false,code:null,role:null,go:null,opp:null,oppGoneAt:0,mine:{},seen:{},lobby:false,
  send(o){ Object.assign(this.mine,o); if(this.room) this.room.presence({pk:this.mine}).catch(e=>console.error('presence '+(e&&e.code))); },
  leave(){ this.mine={}; this.code=this.role=this.go=this.opp=null; this.seen={}; this.lobby=false; if(this.room) this.room.presence({pk:null}).catch(()=>{}); if(this.p2p) PR.stop(); },
  others(){ return this.room?this.room.peers().filter(p=>!p.sameTab&&p.presence&&p.presence.pk):[]; },
  lobbyTick(){ if(!this.lobby||!this.code) return;
    if(this.role==='host'){ const g=this.others().find(p=>p.presence.pk.code===this.code&&p.presence.pk.role==='guest');
      if(g){ this.opp=g.peer; this.go=Math.random().toString(36).slice(2,10); this.send({go:this.go}); startOnline('A'); } }
    else { const h=this.others().find(p=>p.presence.pk.code===this.code&&p.presence.pk.role==='host'&&p.presence.pk.go);
      if(h){ this.opp=h.peer; this.go=h.presence.pk.go; this.send({go:this.go}); startOnline('B'); } } },
  tick(){ if(!this.room||!this.opp) return;
    const o=this.room.peers().find(p=>p.peer===this.opp), pk=o&&o.presence&&o.presence.pk;
    if(!o||!pk||pk.go!==this.go){ if(!this.oppGoneAt) this.oppGoneAt=performance.now(); else if(performance.now()-this.oppGoneAt>4000&&S.phase!=='end'){ this.oppGoneAt=0; oppLeft(); } return; }
    this.oppGoneAt=0; const n=M.turn, sn=this.seen, ph=S.phase;
    if(pk.shot&&pk.shot.n===n&&sn.shot!==n&&ph==='oppwait'){ sn.shot=n; const sh={...pk.shot}; const tr=sh.trick||null; delete sh.n; delete sh.trick; beginRun(sh,tr,sh.lenH||0.45); }
    if(remoteKeeps()&&['run','charge','flight','result'].includes(ph)){
      if(pk.god&&pk.god.n===n&&sn.god!==n){ sn.god=n; armGod(); showTurn('神セーブ!?','相手が1回だけの神セーブを使った',true); }
      if(pk.dive&&pk.dive.n===n&&sn.dive!==n){ sn.dive=n; applyDive({cx:pk.dive.cx,cy:pk.dive.cy,th:pk.dive.th},(S.kt||0)-pk.dive.kt); }

let last=performance.now();
function frame(now){
  const realDt=Math.min(0.05,(now-last)/1000); last=now;
  // スロー：ボールがゴール面の手前1mに来た瞬間だけ0.3倍

  let ts=S.timeScale;
  if(S.hitStop>0){ S.hitStop-=realDt; ts=0.02; }
  if(S.phase==='run'&&R.trick){ const k=S.runT/S.runDur; if(k>0.72&&k<0.94) ts=Math.min(ts,0.32); }   // 技の最高点だけバレットタイム
  if(S.phase==='flight'&&S.hitStop<=0){ if(S.t<0.14) ts*=1.8; else if(pos.z<3.4&&pos.z>-0.35) ts*=0.18; }   // 緩急：放つ瞬間は速く、キーパーの手前で超スロー
  const dt=realDt*ts;
  if(S.phase==='run'){ S.runT+=dt; if(!S.charged && S.runT>=S.chargeAt*S.runDur){ S.runT=S.chargeAt*S.runDur; startCharge(); } else if(S.runT>=S.runDur){ S.runT=S.runDur; launch(); } }
  if(S.phase==='charge'){ S.chargeT+=realDt; updCharge(realDt); if(S.chargeT>=S.chargeDur) endCharge(); }
  if(S.phase==='cpuwait'){ S.cpuT-=realDt; if(S.cpuT<=0) cpuShot(); }
  if(S.phase==='cpuwait'||S.phase==='oppwait'||S.phase==='run'||S.phase==='charge') updGK(S.phase==='charge'?realDt:dt);
  if(S.phase==='run'||S.phase==='flight'||S.phase==='result') S.kt=(S.kt||0)+dt; else if(S.phase==='charge') S.kt=(S.kt||0)+realDt;
  if(M.mode==='online') NET2.tick(); else if(NET2.lobby) NET2.lobbyTick();
  if(S.localR&&!S.resolved&&performance.now()-S.localRAt>5000){ const r=S.localR; S.localR=null; resolve(r); clipNote('相手からの判定が届かないから自分の画面で判定した'); }
  godBtn.hidden=!canGod();   // 蹴る前に飛んだキーパーも動かす
  if(S.phase==='flight'||S.phase==='result'){
    const n=Math.ceil(dt/(1/240)); for(let i=0;i<n;i++){ S.t+=dt/n; step(dt/n); }
    ball.position.copy(pos); ball.rotateOnAxis(spinAxis,spinRate*dt*(pos.y>BALL_R+0.01?1:0.3));
    if(S.resolved && S.phase==='flight') S.phase='result';
    if(S.phase==='result'){ S.bannerT-=realDt; if(S.bannerT<=0){ hideBanner(); recStop(); S.kick++;
      if(M.mode==='solo'){ if(S.kick>=KICKS) finish(); else resetKick(); }
      else { M.turn++; if(decided()) finish(); else resetKick(); } } }
  }
  animate(dt,now/1000); updShoes(dt); updFX(dt); updTrail(); updNet(realDt); updStrobe(realDt,now/1000);
  // カメラ：シュート中だけ少し前へ・ゴール時に揺れ
  // カメラ：待機＝定位置／技＝キッカーの周りを回り込む／シュート＝ボールを後ろから追う／ゴール＝ネットに寄る
  const want=new THREE.Vector3().copy(CAM), look=new THREE.Vector3().copy(LOOK);
  if(S.phase==='run'&&R.trick){ const k=S.runT/S.runDur, u=THREE.MathUtils.clamp((k-0.55)/0.45,0,1), w=Math.sin(u*Math.PI);
    const kp=kicker.root.position, ang=0.9*w; want.lerp(new THREE.Vector3(kp.x+Math.sin(ang)*4.2, 1.5+w*0.6, kp.z+Math.cos(ang)*4.2), w); look.lerp(new THREE.Vector3(kp.x,1.1,kp.z),w); }
  if(S.phase==='flight'||(S.phase==='result'&&S.resolved!=='goal')){ const f=Math.min(1,S.t*2.2);
    want.lerp(new THREE.Vector3(pos.x*0.4+0.4, Math.max(1.5,pos.y+0.8), Math.max(3.8,pos.z+4.5)),f); look.lerp(new THREE.Vector3(pos.x*0.5,Math.max(0.9,pos.y*0.7+0.4),Math.min(pos.z-3,0)),f*0.8); }

  if(S.phase==='charge'){ const u=Math.min(1,S.chargeT/S.chargeDur), kp=kicker.root.position, d=1.25-0.5*u;

    keeper.head.getWorldPosition(gkHead); want.copy(gkHead).add(new THREE.Vector3(0,0.02,0.12));

    const off=THREE.MathUtils.clamp(GK.th/1.45,-1,1), t=performance.now()/1000;   // グローブは飛んでも画面の真ん中を塞がない位置に
    gloves.forEach(q=>{ const idle=GK.active?0:Math.sin(t*6+q.sx)*0.015;
      q.g.position.set(q.sx*0.19-off*0.07, -0.21+Math.abs(off)*0.05+idle, -0.55); q.g.rotation.set(0.15,0,-q.sx*0.25+off*0.35); }); }
  if(!camSmooth){ camSmooth={p:want.clone(),l:look.clone()}; }
  const cs=1-Math.pow(0.0015,realDt); if(!fp){ camSmooth.p.lerp(want,cs); camSmooth.l.lerp(look,cs); }
