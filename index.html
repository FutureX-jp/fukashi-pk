<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no">
<title>フカシPK | Fukashi PK: Penalty Kick</title>
<meta name="description" content="キーパーが強すぎるバカPKゲーム。無料・インストール不要。A goofy 3D soccer penalty shootout - free, no install.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon2-180.png?v=66">
<link rel="icon" type="image/png" href="icon2-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta property="og:title" content="フカシPK | Fukashi PK: Penalty Kick">
<meta property="og:type" content="website">
<meta property="og:description" content="キーパーが強すぎるバカPKゲーム。無料・インストール不要でスマホですぐ遊べる">
<meta property="og:image" content="https://futurex-jp.github.io/fukashi-pk/icon2-512.png">
<meta name="twitter:card" content="summary">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07151A;font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:#F5F7EF}
/* タッチ端末（横持ちタブレット等）で出る左右の余白：黒一色ではなくゲームと同じ色の背景 */
body{background:radial-gradient(ellipse at 50% 110%,rgba(24,140,90,.55),transparent 60%),repeating-linear-gradient(135deg,rgba(223,255,36,.06) 0 18px,transparent 18px 36px),linear-gradient(180deg,#0B2230,#07151A 70%)}
#g{position:absolute;top:0;left:50%;transform:translateX(-50%);border:0;display:block;background:#07151A;box-shadow:0 0 0 3px #111,0 0 40px rgba(0,0,0,.7);z-index:2}
</style>
<script>
/* 公開版（github.io）：CrazyGames の SDK の代わり。外枠の残りのコードは CrazyGames 版と同じ */
(function(){ var q=new URLSearchParams(location.search), none=function(){};
  var here=function(){ return location.origin+location.pathname; };
  window.CrazyGames={SDK:{ environment:'pub',
    init:function(){ return Promise.resolve(); },
    user:{ getUser:function(){ return Promise.resolve(null); } },
    game:{ isInstantMultiplayer:false,
      getInviteParam:function(k){ return k==='room'?(q.get('room')||'').replace(/\D/g,'').slice(0,4):null; },
      inviteLink:function(p){ return here()+'?openExternalBrowser=1&room='+String((p&&p.room)||'').replace(/\D/g,'').slice(0,4); },
      addJoinRoomListener:none, updateRoom:none, showInviteButton:none, hideInviteButton:none, gameplayStart:none, gameplayStop:none, leftRoom:none } }};
  /* 人数の記録（GoatCounter）：ゲームは枠の中で動くので、枠の中でも数える印を渡す（count.js は枠の中だと数えない作り） */
  var n=0, t=setInterval(function(){ try{ var w=document.getElementById('g').contentWindow; if(w&&/game\.html/.test(w.location.pathname)){ w.goatcounter=w.goatcounter||{}; w.goatcounter.allow_frame=true; } }catch(e){} if(++n>1500) clearInterval(t); },20);
})();
</script></head>
<body>
<iframe id="g" title="Fukashi PK: Penalty Kick" allow="autoplay; fullscreen; vibrate; clipboard-write"></iframe>
<script>
// 外枠：PC（マウス）は枠いっぱいの横長で遊ぶ（CrazyGamesのサッカー系は全部横長いっぱい・PC枠は907x510〜）。タッチ端末は縦長9:16を中央に
// 進み具合の保存は CrazyGames の Automatic Progress Save（localStorage）。game.html は同じオリジンなので同じ localStorage
// CrazyGames SDK はここだけで使う：ユーザー名・招待（リンク／ボタン）・Instant Multiplayer・部屋の状態。ゲームとは postMessage（cgpk:1）
(function(){ var f=document.getElementById('g');
    var fine=false; try{ fine=matchMedia('(pointer:fine)').matches&&!('ontouchstart' in window); }catch(e){}
  function fit(){ var W=innerWidth,H=innerHeight,w=W; if(!fine&&W/H>9/16) w=Math.round(H*9/16); f.style.width=w+'px'; f.style.height=H+'px'; }
  addEventListener('resize',fit); fit();
  var SDK=null, started=false;
  function start(q){ if(started) return; started=true; f.src='game.html'+(q?'?'+q:''); f.addEventListener('load',function(){ try{ f.contentWindow.focus(); }catch(e){} }); }
  function toGame(m){ try{ m.cgpk=1; f.contentWindow.postMessage(m,'*'); }catch(e){} }
  setTimeout(function(){ start(''); },5000);   // SDK が応答しない時もゲームは始める
  function ready(){ var p=new URLSearchParams(); var g=SDK.game;
    try{ var r=g.getInviteParam('room'); if(r) p.set('cgroom',r); }catch(e){}
    try{ if(g.isInstantMultiplayer) p.set('cginstant','1'); }catch(e){}
    var fin=function(){ start(p.toString()); };
    try{ SDK.user.getUser().then(function(u){ if(u&&u.username) p.set('cgname',u.username); fin(); }).catch(fin); }catch(e){ fin(); }
    try{ g.addJoinRoomListener(function(ip){ if(ip&&ip.room) toGame({t:'join',room:ip.room}); }); }catch(e){} }
  try{ window.CrazyGames.SDK.init().then(function(){ SDK=window.CrazyGames.SDK; window.__cgReady=true; ready(); }).catch(function(){ start(''); }); }catch(e){ start(''); }
  addEventListener('message',function(e){ var d=e.data; if(!d||d.cgpk!==1||e.source!==f.contentWindow||!SDK) return; var g=SDK.game;
    try{
      if(d.t==='room'){ var room=String(d.room); try{ g.updateRoom({roomId:room,isJoinable:!!d.open,inviteParams:{room:room}}); }catch(x){}
        if(d.open){ try{ g.showInviteButton({room:room}); }catch(x){} } else { try{ g.hideInviteButton(); }catch(x){} } }
      if(d.t==='invite'){ var url=g.inviteLink({room:String(d.room)});
        /* 主「相変わらず対戦の友達招待リンクが長すぎる」2026-10-02：長いのは審査前のプレビュー（QA の印が全部つく）だけ。主と家族の固定URL（…/pk＝fkshort=1 つき）から開いた時だけ短いリンクに差し替える。審査の人・公開後は SDK のリンクのまま（CG の決まり） */
        if(/[?&]fkshort=1(&|$)/.test(location.search)){ var rm=String(d.room).replace(/\D/g,'').slice(0,4); if(rm.length===4) url='https://turn.futurex-works.jp/pk?room='+rm; }
        toGame({t:'link',url:url}); }
      if(d.t==='gp'){ if(d.on) g.gameplayStart(); else g.gameplayStop(); }
      if(d.t==='left'){ try{ g.leftRoom(); }catch(x){} try{ g.hideInviteButton(); }catch(x){} }
    }catch(err){} });
})();
</script>
</body></html>
